# /etc/nginx/conf.d/project-boards.conf: TLS in front of Project Boards. Set server_name and the certificate paths.
server {
	listen 443 ssl;
	server_name boards.example.com;
	ssl_certificate /etc/pki/tls/certs/boards.example.com.crt;
	ssl_certificate_key /etc/pki/tls/private/boards.example.com.key;
	client_max_body_size 200m;

	location / {
		proxy_pass http://127.0.0.1:4780;
		proxy_http_version 1.1;
		proxy_set_header Connection "";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto https;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		# Live page updates and pb wait hold a response open.
		proxy_buffering off;
		proxy_read_timeout 3700s;
	}
}

server {
	listen 80;
	server_name boards.example.com;
	return 301 https://$host$request_uri;
}
