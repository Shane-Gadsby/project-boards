# Actions tab > Draft release > Run workflow. Drafts the release for the VERSION in the code; publishing it is up to you.
name: Draft release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
      - name: Read the version
        id: version
        run: |
          server=$(sed -n "s/^const VERSION = '\(.*\)';$/\1/p" server.js)
          pb=$(sed -n "s/^const VERSION = '\(.*\)';$/\1/p" bin/pb)
          if [ "$server" != "$pb" ]; then
            echo "::error::server.js is $server but bin/pb is $pb"
            exit 1
          fi
          echo "version=$server" >> "$GITHUB_OUTPUT"
      - name: Check it is not released already
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "::error::v$VERSION already has a release: bump VERSION"
            exit 1
          fi
      - run: sh scripts/smoke-test.sh
      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sh scripts/make-dist.sh
          cp bin/pb dist/pb
          (cd dist && sha256sum pb > pb.sha256)
          sh scripts/release-notes.sh "$VERSION" > dist/notes.md
          if [ ! -s dist/notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" --draft --target "$GITHUB_SHA" --title "v$VERSION" --notes-file dist/notes.md \
            "dist/project-boards-$VERSION.tar.gz" "dist/project-boards-$VERSION.tar.gz.sha256" dist/pb dist/pb.sha256
